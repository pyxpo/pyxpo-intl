[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-intl"
dynamic = ["version"]
description = "ICU messages, plural rules, and locale number and date formatting for pyxpo, in pure Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "i18n", "l10n", "intl", "icu", "messageformat", "plural", "locale", "number-format", "date-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a2,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo-intl"
Documentation = "https://github.com/pyxpo/pyxpo-intl/blob/main/README.md"
Changelog = "https://github.com/pyxpo/pyxpo-intl/blob/main/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo-intl"
Issues = "https://github.com/pyxpo/pyxpo-intl/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
intl = "pyxpo_intl"

[tool.setuptools]
packages = ["pyxpo_intl"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_intl.__version__" }

[tool.setuptools.package-data]
pyxpo_intl = ["pyxpo-module.json", "py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
